# CI: build, vet, test, and the codegen drift gate.
#
# Most per-primitive collection sources are CODE-GENERATED from internal/codegen
# (text/template + go/format). The committed files carry a
# "// Code generated by internal/codegen; DO NOT EDIT." banner. The drift gate
# re-runs `go generate ./...` and fails if any committed file changed OR if the
# generator emitted a file that was not already tracked (a stray/new file). This
# keeps the generator the single source of truth: edit the template, never the
# generated file. Float-ordered collections also regenerate their cmp_float.go
# from the single shared genCmpFloat template.

name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Codegen drift gate
        run: |
          banner='// Code generated by internal/codegen; DO NOT EDIT.'
          # Delete every committed generated source first, then regenerate. A file
          # is "generated" iff its FIRST line is the banner — the generator's own
          # sources carry the banner only as a string literal (never on line 1), so
          # they are preserved. Delete-then-regenerate catches three failure modes:
          #   - drift:   a committed file differs from its template      -> git diff
          #   - orphan:  the templates no longer emit a committed file    -> git diff (stays deleted)
          #   - stray:   the templates emit a file that was never committed -> git status
          while IFS= read -r f; do
            if [ "$(head -n 1 "$f")" = "$banner" ]; then rm -f "$f"; fi
          done < <(git ls-files '*.go')
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::generated sources are out of date or orphaned — run 'go generate ./...' and commit the result" >&2
            exit 1
          fi
          stray="$(git status --porcelain --untracked-files=all)"
          if [ -n "$stray" ]; then
            echo "::error::'go generate ./...' produced untracked files:" >&2
            echo "$stray" >&2
            exit 1
          fi
