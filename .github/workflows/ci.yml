# CI: build, vet, gofmt, test (+ -race), and the codegen drift gate.
#
# Most per-primitive collection sources are CODE-GENERATED from internal/codegen
# (text/template + go/format). The committed files carry a
# "// Code generated by internal/codegen; DO NOT EDIT." banner. The drift gate
# (scripts/check-codegen.sh) re-runs `go generate ./...` and fails if any
# committed file changed OR if the generator emitted a file that was not already
# tracked (a stray/new file). This keeps the generator the single source of
# truth: edit the template, never the generated file. Float-ordered collections
# also regenerate their cmp_float.go from the single shared genCmpFloat template.

name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean — run 'gofmt -w .':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Codegen drift gate
        run: ./scripts/check-codegen.sh

  # The Synchronized wrappers document lock-ordering guarantees that are never
  # otherwise machine-checked. A dedicated race lane exercises them (and any
  # other concurrent test) under the race detector.
  race:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race)
        run: go test -race ./...
